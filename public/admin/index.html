<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Repair Shop - Admin Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* Admin Specific Dashboard Layout */
    .dashboard-header {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-lg);
    }

    @media (min-width: 640px) {
      .dashboard-header {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-lg);
    }

    .summary-card {
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: var(--spacing-md);
      text-align: center;
    }

    .summary-card .number {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent-color);
    }

    .summary-card .label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .filters-bar {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-lg);
    }

    @media (min-width: 640px) {
      .filters-bar {
        flex-direction: row;
      }
      .filters-bar .form-control {
        width: auto;
      }
      .filters-bar .search-input {
        flex-grow: 1;
      }
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background-color: var(--surface-color);
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .admin-table th,
    .admin-table td {
      padding: var(--spacing-md);
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }

    .admin-table th {
      background-color: var(--surface-hover);
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
    }

    .admin-table tr:last-child td {
      border-bottom: none;
    }

    .admin-table tr:hover {
      background-color: rgba(255, 255, 255, 0.02);
    }

    .action-buttons {
      display: flex;
      gap: var(--spacing-xs);
    }

    .action-buttons .btn {
      min-height: 32px;
      padding: 0 var(--spacing-sm);
      font-size: 0.8rem;
    }

    .btn-success {
      background-color: var(--accent-color);
      color: #000;
    }

    .btn-success:hover:not(:disabled) {
      background-color: var(--accent-hover);
    }
  </style>
</head>
<body>
  <header class="header">
    <a href="/admin/index.html" class="brand">
      <span>&#9881;</span> TechFix <small style="font-size: 0.75rem; color: var(--accent-color); margin-left: 0.5rem;">[Dashboard]</small>
    </a>
    <nav class="nav">
      <button id="logout-btn" class="btn btn-secondary" style="min-height: 36px; padding: 0 var(--spacing-md);">Logout</button>
    </nav>
  </header>

  <main class="container" style="max-width: 1100px;">
    <div class="dashboard-header">
      <div>
        <h1 class="page-title">Bookings Manager</h1>
        <p class="page-subtitle" style="margin-bottom: 0;">Review, confirm, cancel, and manage customer service appointments.</p>
      </div>
    </div>

    <div id="status-banner" class="banner"></div>

    <!-- Summary Metrics -->
    <div class="summary-grid">
      <div class="summary-card">
        <div id="total-count" class="number">0</div>
        <div class="label">Total Bookings</div>
      </div>
      <div class="summary-card">
        <div id="pending-count" class="number" style="color: var(--warning-color);">0</div>
        <div class="label">Pending</div>
      </div>
      <div class="summary-card">
        <div id="confirmed-count" class="number" style="color: var(--accent-color);">0</div>
        <div class="label">Confirmed</div>
      </div>
    </div>

    <!-- Controls / Filters -->
    <div class="filters-bar">
      <input type="text" id="search-input" class="form-control search-input" placeholder="Search reference, name, email, or service...">
      <select id="status-filter" class="form-control">
        <option value="all">All Statuses</option>
        <option value="pending">Pending</option>
        <option value="confirmed">Confirmed</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </div>

    <!-- Bookings Data Table -->
    <div class="table-responsive">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Reference</th>
            <th>Service</th>
            <th>Customer</th>
            <th>Contact</th>
            <th>Date & Time</th>
            <th>Guests</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="bookings-tbody">
          <tr>
            <td colspan="8" class="state-box">Loading repair appointments...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="/js/main.js"></script>
  <script src="/admin/admin.js"></script>
</body>
</html>
